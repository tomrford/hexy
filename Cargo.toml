[workspace]
members = ["crates/hexy-core", "crates/hexy-compat", "crates/hexy-py"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tomrford/hexy"

[workspace.dependencies]
crc = "3.4.0"
ed25519-dalek = { version = "2.1.1", features = ["digest", "pem", "pkcs8"] }
md-5 = "0.10.6"
ripemd = "0.1.3"
rsa = { version = "0.9.8", features = ["getrandom", "sha2"] }
sha1 = "0.10.6"
sha2 = "0.10.9"
thiserror = "2.0.17"
x509-cert = "0.2.5"
pyo3 = "0.28.3"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
implicit_clone = "warn"
assigning_clones = "warn"
cloned_instead_of_copied = "warn"
map_clone = "warn"
inefficient_to_string = "warn"
str_to_string = "warn"
